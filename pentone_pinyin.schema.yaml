# Rime schema
# encoding: utf-8

schema:
  schema_id: pentone_pinyin
  name: 筆調拼音
  version: "0.0"
  author:
    - 陳林 <1chen0bryan@gmail.com>
  description: |
    双拼+筆畫＊聲調
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - selector
    - lua_processor@*common.trikey*proc
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - lua_translator@*pentone_translator@translator
  filters:
    - simplifier
    - uniquifier
    - lua_filter@*shuangpin_stroke_filter

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 兼容万象拼音 (
    - xform/^([a-z]+)$/$1⑤/
    - xform/(ā|ē|ī|ō|ū|ǖ)([a-z]*)$/$1$2①/
    - xform/(á|é|í|ó|ú|ǘ|ń|ḿ)([a-z]*)$/$1$2②/
    - xform/(ǎ|ě|ǐ|ǒ|ǔ|ǚ|ň)([a-z]*)$/$1$2③/
    - xform/(à|è|ì|ò|ù|ǜ|ǹ)([a-z]*)$/$1$2④/
    - xform/m̄([a-z]*)$/m$1①/
    - xform/m̀([a-z]*)$/m$1④/
    - xlit/āáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜńňǹḿ/aaaaeeeeiiiioooouuuuvvvvvnnnm/
    - xlit/①②③④⑤/12345/
    - derive/^ng(\d)/eng$1/
    # )
    - derive/^([a-z]+)[0-5]$/$1/ # 允許省略聲調
    - derive/^([jqxy])u/$1v/

translator:
  dictionary: terra_pinyin
  prism: pentone_pinyin
  spelling_hints: 5

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔筆畫〕

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: period, send: period }
    - { when: has_menu, accept: comma, send: comma }

recognizer:
  patterns:
    reverse_lookup: "`[a-z]*'?$"
