# Rime schema
# encoding: utf-8

schema:
  schema_id: pentone_pinyin
  name: 筆調拼音
  version: "0.0"
  author:
    - 陳林 <1chen0bryan@gmail.com>
  description: |
    双拼+筆畫+聲調
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - lua_translator@*shuangpin_translator@translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/^([a-z]+)[0-5]$/$1/ # 省略聲調

translator:
  dictionary: terra_pinyin

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔筆畫〕

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  patterns:
    reverse_lookup: "`[a-z]*'?$"
